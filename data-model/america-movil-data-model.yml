domains:
  claro_declared:
  - {domain: Customer, source: 'x-claro-domains in the SIM Swap spec'}
  - {domain: Geographic Location, source: 'x-claro-domains in the LBS spec'}
observations:
- No entity carries a server-assigned resource id; correlation is by transactionId only.
- Response payloads are verdicts (boolean/score/date), which is why the estate has no ERD in the conventional sense.
- Subscriber attributes behind the KYC family are refreshed daily, per the product FAQs.
