generated: '2026-07-25'
method: derived
source: >-
  Schemas and $ref graph of openapi/america-movil-claro-sim-swap-openapi.json and
  openapi/america-movil-claro-device-location-openapi.json, plus the request
  payloads Claro publishes for the products that have no specification.
description: >-
  The Claro Brasil network-API estate has no CRUD object model — there are no
  resources to create, list or delete. Every product is a lookup keyed on one of
  three subscriber identifiers, returning an attribute or a verdict. The whole
  data model is therefore an identifier graph: MSISDN, CPF and (for M2M) device
  identifiers fan out to network facts.
primary_keys:
- key: phoneNumber / networkMsisdn / MSISDN
  format: E.164 (+55DDNNNNNNNNN) or bare 55DDNNNNNNNNN depending on the product generation
  used_by: [SIM Swap, Number Verification, Number Recycling, Tenure, KYC Match, KYC Fill In, Device Location, Geofencing, Claro Alerta, Claro Valida Telefone, Claro Valida Endereço]
- key: cpf / idCpf / idDocument
  format: Brazilian taxpayer identifier
  used_by: [Claro Score, Claro Valida Telefone, Claro Valida Endereço, Face Match, KYC Match]
- key: networkAccessIdentifier / ipv4Address / ipv6Address
  format: 3GPP GPSI external identifier, or the device's public IP and port
  used_by: [Geofencing]
