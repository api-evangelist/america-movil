actions:
  openapiHarvested: 2
  openapiPaths:
    - openapi/america-movil-claro-sim-swap-openapi.json
    - openapi/america-movil-claro-device-location-openapi.json
  apisYmlCreated: true
  reason: >-
    Bootstrap of the América Móvil provider profile for the telecom sector study.
    Identity captured from the corporate site and the 2025 Form 20-F reporting.
    Fifteen real, documented APIs listed — fourteen Claro Brasil marketplace
    products with live public detail pages, plus the Telcel Mexico Open Gateway
    listing recorded honestly as a sales surface. Two OpenAPI documents harvested
    verbatim from the provider's own public file store. No spec, endpoint, scope
    or host in this repository was invented.
