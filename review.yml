    realSurface:
      url: https://www.claroinsight.com.br/
      status: 200
      redirectFrom: https://desenvolvedor.claro.com.br/ (301)
      verdict: >-
        REAL but REGISTRATION-GATED marketplace. Drupal-based "Marketplace API
        Claro" operated by Claro Brasil. Public: a 14-API catalog at
        /pt-br/catalogo-api, a per-API detail page for every product (all 200), a
        plan/checkout flow (e.g. /pt-br/checkout/sim-swap/catalog/2490/plan/1361),
        an onboarding page and an FAQ. Gated: every product page says "baixe a API
        Swagger clicando no botão abaixo" but the Swagger download, endpoints,
        credentials and consumption dashboards require /user/register and
        /pt-br/user/login. No base URLs, auth details or examples are shown to an
        anonymous visitor.
      isSelfServe: false
      isLoginWall: partial
    mexicoSurface:
      url: https://www.telcel.com/empresas/soluciones/busines-intelligence/autenticacion-movil
      status: 403
      note: >-
        403 to non-browser clients (bot protection); renders in a browser. Names
        Number Verification, SIM change detection and Device Location
        Verification under "el proyecto Open Gateway impulsado por Telcel y los
        operadores en México". No portal, no spec, no sandbox, no pricing — only a
        "Contáctanos" sales form. This is a MARKETING PAGE, not a developer
        portal.
      isDeveloperPortal: false
  openapiHarvested: true
  specsCount: 2
  specs:
    - path: openapi/america-movil-claro-sim-swap-openapi.json
      originalFilename: mobile-gsmagatewaysimswap-v1 (2).json
      sourceURL: https://www.claroinsight.com.br/sites/default/files/files/sim-swap-docs-pt.zip
      sourceHTTPStatus: 200
      fetchDate: '2026-07-25'
      discoveredVia: >-
        Linked directly from the public product page
        https://www.claroinsight.com.br/pt-br/sim-swap (the "download docs" zip,
        served anonymously despite the page copy implying login).
      format: OpenAPI 3.0.3
      parsed: true
      title: SIM Swap
      specVersion: 0.4.0 (per embedded changelog, author Diego Bulsing Rodrigues, 2023-12-01)
      paths:
        - POST /retrieve-date
        - POST /check
      servers:
        - https://api-sandbox.claro.com.br/mobile/v1/gsma/gateway/simswap (Sandbox SaaS)
        - https://api-lab.claro.com.br/mobile/v1/gsma/gateway/simswap (Lab SaaS)
        - https://api-dev.claro.com.br/mobile/v1/gsma/gateway/simswap (Dev SaaS)
        - https://api-test.claro.com.br/mobile/v1/gsma/gateway/simswap (Test SaaS)
        - https://api.claro.com.br/mobile/v1/gsma/gateway/simswap (Production SaaS)
      securitySchemes:
        - OAuth2 clientCredentials, tokenUrl /oauth2/v1/token, no declared scopes
      note: >-
        The description states the API "derives from the GSMA Mobile Connect
        Account Takeover Protection specification". The operation shape
        (retrieve-date + check) matches CAMARA SIM Swap v0.4.0. The zip also
        contained "Tutorial de consumo da API SIM Swap.pdf" (not committed).
    - path: openapi/america-movil-claro-device-location-openapi.json
      originalFilename: Swagger_API_LBS_Device_Locations.json
      sourceURL: https://www.claroinsight.com.br/sites/default/files/files/device-location-docs-pt.zip
      sourceHTTPStatus: 200
      fetchDate: '2026-07-25'
      discoveredVia: >-
        Direct path probe of the portal's public file store, guessed from the
        sim-swap zip naming convention. NOT linked from any current catalog page —
        the Device Location product pages carry no download link. An identical
        English-language zip is served at device-location-docs-en.zip (200,
        byte-identical spec, English PDF).
      format: OpenAPI 3.0.0
      parsed: true
      title: "Mobile - LBS Devices Locations (Proxy Apigee: mobile-lbsdeviceslocations-v1)"
      specVersion: 1;2023-06-30
      paths:
        - GET /lbs/devices/locations
      servers:
        - https://api-sandbox.claro.com.br/mobile/v1 (Sandbox SaaS)
        - https://api-test.claro.com.br/mobile/v1 (Test SaaS)
        - https://api.claro.com.br/mobile/v1 (Production SaaS)
        - https://test.apigw.claro.com.br/mobile/v1 (Test on-premises)
        - https://cas.apigw.claro.com.br/mobile/v1 (Production on-premises, DC Campinas)
        - https://lpa.apigw.claro.com.br/mobile/v1 (Production on-premises, DC Lapa)
      securitySchemes:
        - HTTP Basic
        - HTTP Bearer
        - apiKey header X-API-Key
        - OAuth2 clientCredentials, tokenUrl /oauth2/v1/token
      note: >-
        This is Claro's own LBS platform API, not a CAMARA document — it predates
        and sits beside the CAMARA Device Location work. The Apigee proxy name is
        exposed in the title, and the on-premises data-centre hostnames are
        published.
  camara:
    posture: >-
      Real CAMARA-aligned implementation in Brazil only; press-release-only in
      Mexico and the rest of the footprint.
    detail: >-
      Claro Brasil ships a genuine CAMARA-derived SIM Swap API — a downloadable
      OpenAPI 3.0.3 document with CAMARA's retrieve-date/check operation shape,
      live production and sandbox hosts under a /gsma/gateway/ path, and OAuth2
      client credentials. That is an implementation, not an announcement, and it
      is the strongest CAMARA evidence anywhere in the América Móvil group.
      Everything else is softer: the Claro Insight catalog lists Number
      Verification, Device Location Verify and KYC as products but publishes no
      specification for them, and Telcel's Mexican Open Gateway launch of SIM
      Swap / Number Verification / Device Location on 28 May 2025 has produced a
      marketing page and a sales form and nothing callable. A press release is
      not an implementation, and in Mexico — América Móvil's home market and its
      largest — that is exactly what exists.
    apisWithEvidence:
      - name: SIM Swap
        evidence: >-
          OpenAPI 3.0.3 harvested; POST /retrieve-date + POST /check; production
          host https://api.claro.com.br/mobile/v1/gsma/gateway/simswap.
        strength: implementation
      - name: Number Verification
        evidence: >-
          Named product page at claroinsight.com.br/pt-br/number-verification
          (200) and named in the GSMA Mexico Open Gateway launch (28 May 2025) and
          the Brazil launch (Nov 2023). No spec published.
        strength: product-listing
      - name: Device Location / Location Verification
        evidence: >-
          Two Claro Insight product pages (device-location-verify,
          device-location-retrievel, both 200), an LBS OpenAPI harvested (Claro's
          own, not CAMARA), and named in both the Brazil and Mexico Open Gateway
          launches.
        strength: implementation-adjacent
      - name: KYC Match
        evidence: >-
          "Know your customer" product page at claroinsight.com.br/pt-br/claro-kyc
          (200); Claro Empresas announced a KYC API under Open Gateway. No spec.
        strength: product-listing
      - name: Number Recycling
        evidence: >-
          Product page at claroinsight.com.br/pt-br/number-recycling (200). No
          spec.
        strength: product-listing
      - name: Tenure
        evidence: Product page at claroinsight.com.br/pt-br/tenure (200). No spec.
        strength: product-listing
      - name: Device Swap
        evidence: >-
          Marketed as "Claro Alerta" (claroinsight.com.br/pt-br/claro-alerta,
          200) — detects SIM or device change. Claro-branded rather than
          CAMARA-named. No spec.
        strength: product-listing
      - name: Geofencing
        evidence: >-
          Product page at claroinsight.com.br/pt-br/geofencing (200). CAMARA has a
          Geofencing subscription API; Claro's is described as M2M cellular
          monitoring. No spec.
        strength: product-listing
    apisNotFound:
      - Quality on Demand (QoD)
      - Carrier Billing
      - Device Status / Reachability
      - Anti-fraud / Scam Signal (as a CAMARA-named API)
      - Population Density
    camaraProjectMembership: >-
      América Móvil is NOT among the companies named in the Linux Foundation's
      28 February 2022 CAMARA founding press release (AT&T, Capgemini, Deutsche
      Telekom, Ericsson, GSMA, Google Cloud, IBM, Intel, Kandy, KDDI, Microsoft,
      MobiledgeX, Nokia, NGMN, Orange, Scenera, T-Mobile US, TIM, Telefónica,
      TELUS, the Linux Foundation, Vodafone). Its CAMARA relationship is as a
      downstream implementer via GSMA Open Gateway, not as a founding
      specification author.
  openGateway:
    member: true
    evidence: >-
      GSMA names América Móvil among the Latin American operator groups
      participating in GSMA Open Gateway. Claro launched Open Gateway in Brazil
      with TIM and Vivo in November 2023 (number verification, SIM swap, device
      location); Telcel launched in Mexico on 28 May 2025 at M360 LATAM alongside
      Altán Redes, AT&T Mexico and Telefónica Mexico with SIM Swap, Number
      Verification and Device Location — making Mexico the 5th Latin American and
      14th global country to adopt. Claro is also named in the Argentina launch
      (with Telecom and Telefónica) and the Uruguay launch (with Antel), and
      Claro Ecuador carries a GSMA Open Gateway institutional page
      (claro.com.ec/institucional/gsma-open-gateway/, 200 — which contains no API
      or developer content at all).
  aduna:
    equityPartner: false
    note: >-
      América Móvil was named in Ericsson's September 2024 announcement of the
      network-API joint venture that became Aduna, but it is ABSENT from the
      twelve-CSP equity structure completed in July 2025 (AT&T, Bharti Airtel,
      Deutsche Telekom, KDDI, Orange, Reliance Jio, Singtel, Telefónica, Telstra,
      T-Mobile, Verizon, Vodafone alongside Ericsson's 50%). It is therefore
      outside the industry's single largest commercial aggregation channel for
      network APIs — a notable gap for the largest operator group in Latin
      America.
  channelToDevelopers: >-
    Aggregator-mediated outside Brazil. Infobip announced a partnership with three
    Brazilian mobile network operators — including Claro — to launch the first
    CAMARA-compliant network APIs in Brazil under GSMA Open Gateway, and Brazil's
    launch materials point developers at Microsoft Azure and integrators such as
    Infobip. Claro Brasil is the only América Móvil operating company that also
    sells directly, through the Claro Insight marketplace and a
    "Conexão Claro Open Gateway for Startups" programme offering 1,000 free calls
    per month for six months. In Mexico, Telcel offers no direct developer channel
    at all — the only route is a sales conversation.
  tmForum:
    conformanceFound: false
    note: >-
      No TM Forum Open API conformance certification was found for América Móvil,
      Telcel, Telmex, Claro or Embratel. No TMF620 / TMF622 / TMF641 badge or
      certificate is published on any group property. TM Forum and GSMA now
      operate a unified conformance programme covering TM Forum Operate APIs
      alongside CAMARA Service APIs; nothing in the group appears in it as of this
      review.
  threeGppExposure:
    nefOrScef: false
    networkSlicing: false
    edgeMec: false
    note: >-
      No NEF or SCEF surface, no network-slicing API and no edge/MEC API is
      published or documented anywhere in the group's public properties.
  authModel:
    schemes:
      - OAuth 2.0 client credentials (both harvested specs; tokenUrl /oauth2/v1/token)
      - HTTP Basic (Device Location spec)
      - HTTP Bearer (Device Location spec)
      - API key header X-API-Key (Device Location spec)
    ciba: false
    cibaNote: >-
      CIBA (Client-Initiated Backchannel Authentication) does NOT appear anywhere.
      Neither harvested specification references CIBA, OIDC, an authorization
      endpoint, or a backchannel flow. Both use plain OAuth2 client-credentials —
      the enterprise-to-enterprise pattern, not CAMARA's specified
      network-based user-authorization pattern. There is no subject-consent
      mechanism in evidence.
    wellKnown:
      - url: https://api.claro.com.br/.well-known/openid-configuration
        status: 403
      - url: https://api.claro.com.br/.well-known/oauth-authorization-server
        status: 403
      - url: https://api-sandbox.claro.com.br/.well-known/openid-configuration
        status: 404
      - url: https://www.claroinsight.com.br/.well-known/openid-configuration
        status: 404
    tokenEndpoint:
      url: https://api.claro.com.br/oauth2/v1/token
      status: 401
      note: Live and rejecting anonymous requests, as expected.
  webhooksAndEvents:
    published: false
    asyncapi: false
    note: >-
      No webhook catalog and no AsyncAPI document is published. Neither harvested
      OpenAPI declares a callbacks or webhooks section. The Geofencing product is
      described in marketing copy as raising notifications, but no event schema,
      delivery mechanism or subscription API is documented publicly.
  graphql:
    found: false
    note: No /graphql surface was found on any group property.
  grpc:
    found: false
    note: No published .proto files.
  sdks:
    firstParty: false
    note: >-
      No first-party SDK packages were found on npm, PyPI, Maven or NuGet for
      América Móvil, Telcel or Claro network APIs. The consumption "tutorials"
      shipped in the docs zips are PDFs, not code.
  sourceControl:
    note: >-
      No public GitHub presence. github.com/americamovil and
      github.com/america-movil are 404. github.com/clarobrasil and
      github.com/claro-brasil exist as organizations with 0 public repositories;
      github.com/telcel and github.com/ClaroColombia exist as user accounts with 0
      public repositories. All four are effectively name placeholders.
  postman:
    workspaceFound: true
    verified: false
    url: https://www.postman.com/clarojobs/claro
    note: >-
      A public Postman workspace named "Claro" (team handle "clarojobs", publisher
      NOT verified, created 2021-11-26, last active 2026-06-12) contains 183
      collections. Sampled collection names are internal microservice test suites
      — "msnotificationcuschannel", "MSProductRegisterLinkWHT" ("Colección de
      pruebas para el microservicio MSProductRegisterLinkWHT"), "WIN - Toolbox".
      This is not a published developer product, is not linked from any Claro
      property, and its affiliation with América Móvil is UNCONFIRMED. It is
      recorded here as an observation only and is deliberately NOT listed as an
      API property in apis.yml.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.claro.com.br/mobile/v1/gsma/gateway/simswap
      documented: true
      note: CAMARA-derived SIM Swap, OpenAPI 3.0.3 harvested.
    - protocol: REST
      scheme: https
      baseURL: https://api.claro.com.br/mobile/v1
      documented: true
      note: LBS Devices Locations, OpenAPI 3.0.0 harvested.
    - protocol: GraphQL
      documented: false
    - protocol: gRPC
      documented: false
    - protocol: WebSocket
      scheme: wss
      documented: false
    - protocol: AsyncAPI/Events
      documented: false
