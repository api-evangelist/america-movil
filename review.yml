aid: america-movil
name: América Móvil
review:
  question: >-
    Does América Móvil publish a real, self-serve public developer surface, and
    what is its CAMARA / GSMA Open Gateway posture?
  answer: partial
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Mexico
  tier: mno-carrier
  gated: true
  summary: >-
    América Móvil has no corporate developer portal. The only real API surface in
    the group belongs to one operating company — Claro Brasil — whose "Claro
    Insight" marketplace publishes a 14-API catalog with per-API detail pages,
    priced plans and a checkout flow, but keeps every Swagger download behind
    registration. Two OpenAPI documents were nonetheless recovered from the
    portal's own public file store and are saved verbatim. In the home market of
    Mexico, Telcel's Open Gateway launch is real as a commitment and a sales
    listing, but there is nothing callable and nothing published. América Móvil
    is a GSMA Open Gateway participant, was named at the September 2024 launch of
    Aduna and then dropped out of the July 2025 equity structure, and reaches
    developers in Brazil through the CPaaS aggregator Infobip rather than
    directly.
