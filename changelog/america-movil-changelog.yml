description: >-
  Claro Brasil publishes no single dated changelog for the marketplace. What it
  publishes instead is a per-API version block — version, author, date, change
  note — on each product page. Collected here as a per-product release record,
  newest first. It shows the estate's two waves clearly: a 2019 "API
  Monetization MVP" wave of Claro-authored customer-data services, and a
  2023-2025 GSMA Open Gateway wave.
