gaps:
- No metadata document — clients cannot discover the token endpoint programmatically.
- No refresh-token, token-introspection or revocation endpoint is documented.
- >-
  No subject authorization. CAMARA specifies three-legged/CIBA authorization for
  SIM Swap, Number Verification, KYC and Device Location; Claro implements
  two-legged client credentials, and the LGPD consent its own docs require for
  Device Location Verify is contractual rather than protocol-enforced.
