observations:
- Strong e-mail authentication on the brand domains (SPF + DMARC p=reject) but none on claroinsight.com.br.
- No CAA record on any domain — any CA may issue for these names.
- No DNSSEC anywhere in the estate.
- HSTS is enforced on the production API edge and the Brazilian consumer site, but not on the sandbox edge or the developer marketplace.
