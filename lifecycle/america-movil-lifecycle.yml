generated: '2026-07-25'
method: searched
source: >-
  https://api.claro.com.br/docs (status-code contract), the Documentação tab of
  every Claro Insight product page (version + author + date + changes), and the
  info blocks of the two harvested OpenAPI documents.
versioning:
  schemes:
  - {scheme: 'major;date', example: '1;2023-06-30', where: gateway document version and the apiVersion response field}
  - {scheme: semver, example: 0.4.0, where: CAMARA-derived products}
  - {scheme: uri-path, example: /customers/v2, where: request path}
  current_by_product: changelog/america-movil-changelog.yml
  notes: >-
    Two versioning cultures coexist. The 2019 "customers" services carry a
    Claro-internal `major;date` document version. The 2023-2025 Open Gateway
    products carry the CAMARA semantic version of the specification they derive
    from (SIM Swap 0.4.0, Number Verification 0.3.1, KYC family 0.2.1, Device
    Location Verify 0.1.0, Tenure 0.1.0).
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  retirement_signal:
    status: 410
    rule: >-
      "Gone — identifica que o recurso não está mais disponível. Deve ser
      utilizado para API e versões aposentadas, identificando que uma nova versão
      ou outra API deverá ser utilizada."
    source: https://api.claro.com.br/docs
  notes: >-
    Claro publishes no dated deprecation or sunset policy, no notice period, and
    no RFC 8594 Sunset/Deprecation headers. The only published retirement
    contract is the reserved use of HTTP 410 for retired APIs and versions, plus
    403 when an uncontracted version is requested. This is a status-code
    convention, not a lifecycle policy.
