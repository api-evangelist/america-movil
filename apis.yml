- aid: america-movil:claro-number-recycling-api
  name: Claro Number Recycling API
  description: >-
    Detects whether a Brazilian mobile number has changed owner — the recycling
    of a disconnected number to a new subscriber — so that accounts keyed to a
    phone number are not silently transferred. Listed in the Claro Insight
    catalog; documentation requires portal registration.
  humanURL: https://www.claroinsight.com.br/pt-br/number-recycling
  baseURL: https://api.claro.com.br/number-recycling/v0.1
