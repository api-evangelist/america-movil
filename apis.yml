aid: america-movil
url: https://raw.githubusercontent.com/api-evangelist/america-movil/refs/heads/main/apis.yml
name: América Móvil
kind: company
description: >-
  América Móvil, S.A.B. de C.V. is the largest telecommunications group in Latin
  America, headquartered in Mexico City and controlled by the Slim family. It
  serves roughly 331 million wireless subscribers and 79 million fixed
  revenue-generating units across 23 countries (2025 Form 20-F), operating as
  Telcel and Telmex in its home market of Mexico, as Claro across most of Latin
  America and the Caribbean, and as the majority owner of A1 Telekom Austria
  Group in Central and Eastern Europe. In the value chain it is a mobile network
  operator and fixed-line carrier — it owns the spectrum, the radio access
  network, the SIM estate and the subscriber identity records that network APIs
  monetize, and it does not resell anyone else's connectivity. Its API posture is
  the classic carrier posture: there is no corporate developer portal at
  americamovil.com (the domain is an investor-relations site and returns 403 to
  non-browser clients; developer.*, developers.*, docs.*, api.* and opengateway.*
  subdomains do not resolve), and the only real API surface in the group sits
  inside one operating company — Claro Brasil's "Claro Insight" marketplace at
  claroinsight.com.br, a registration-gated catalog of 14 network and identity
  APIs including CAMARA-aligned SIM Swap, Number Verification and Device
  Location. In Mexico, Telcel launched GSMA Open Gateway on 28 May 2025 alongside
  Altán Redes, AT&T Mexico and Telefónica Mexico with three APIs — SIM Swap,
  Number Verification and Device Location — but publishes no portal, no
  specification and no sandbox, only a business sales contact form. América Móvil
  is a GSMA Open Gateway participant and was named in Ericsson's September 2024
  launch of the Aduna network-API joint venture, but it is absent from the final
  twelve-CSP equity structure completed in July 2025; in Brazil its CAMARA APIs
  reach developers through the CPaaS aggregator Infobip. Outside the Brazilian
  marketplace, América Móvil is partner-gated and sales-led, and is reachable by
  most developers only through an aggregator rather than directly.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
