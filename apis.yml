    url: https://www.claroinsight.com.br/pt-br/claro-kyc
  - type: APIReference
    url: https://www.claroinsight.com.br/pt-br/catalogo-api
- aid: america-movil:claro-kyc-fill-in-api
  name: Claro KYC Fill In API
  description: >-
    Returns verified customer registration data held by Claro Brasil so that
    onboarding forms can be pre-populated from carrier records rather than
    self-declared input. Listed in the Claro Insight catalog; documentation
    requires portal registration.
  humanURL: https://www.claroinsight.com.br/pt-br/fill-in
  baseURL: https://api.claro.com.br/mobile/v1/gsma/gateway/kyc
  tags:
