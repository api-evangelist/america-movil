- aid: america-movil:telcel-mobile-authentication-apis
  name: Telcel Mobile Authentication APIs
  description: >-
    América Móvil's GSMA Open Gateway surface in its home market of Mexico,
    marketed by Telcel to enterprises as "Autenticación Móvil" — Number
    Verification (silent authentication of the mobile number), SIM change
    detection, and device location verification. Launched 28 May 2025 alongside
    Altán Redes, AT&T Mexico and Telefónica Mexico. There is no developer portal,
    no published specification, no sandbox and no self-serve signup; the page
    offers only a sales contact form routed to a Telcel account executive. This
    is a commitment and a sales listing, not a callable public API.
  humanURL: https://www.telcel.com/empresas/soluciones/busines-intelligence/autenticacion-movil
  tags:
  - Open Gateway
  - CAMARA
  - Number Verification
  - SIM Swap
  - Device Location
  - Mexico
  properties:
  - type: Documentation
    url: https://www.telcel.com/empresas/soluciones/busines-intelligence/autenticacion-movil
