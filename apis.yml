apis:
- aid: america-movil:claro-sim-swap-api
  name: Claro SIM Swap API
  description: >-
    CAMARA-aligned SIM Swap API from Claro Brasil, exposed through the Claro
    Insight API marketplace. Returns the date of the most recent SIM pairing
    change on a Brazilian mobile line, or checks whether a swap occurred within a
    caller-supplied window, for account-takeover and payment-fraud prevention.
    The published OpenAPI 3.0.3 document declares POST /retrieve-date and POST
    /check, sandbox / lab / dev / test / production servers under
    api*.claro.com.br, and OAuth 2.0 client-credentials authorization. The
    document states the API derives from the GSMA Mobile Connect Account Takeover
    Protection specification.
  humanURL: https://www.claroinsight.com.br/pt-br/sim-swap
  baseURL: https://api.claro.com.br/mobile/v1/gsma/gateway/simswap
  tags:
  - SIM Swap
  - CAMARA
  - Open Gateway
  - Anti-Fraud
  - Identity Verification
  properties:
  - type: OpenAPI
    url: openapi/america-movil-claro-sim-swap-openapi.json
  - type: Documentation
    url: https://www.claroinsight.com.br/pt-br/sim-swap
  - type: APIReference
    url: https://www.claroinsight.com.br/pt-br/catalogo-api
  - type: Overlay
    url: overlays/america-movil-claro-sim-swap-overlay.yaml
  - type: AgentSkill
    url: skills/america-movil-sim-swap-fraud-check.md
- aid: america-movil:claro-device-location-api
  name: Claro Device Location API
  description: >-
    Location-Based Services device-location API from Claro Brasil, published as
    "Mobile - LBS Devices Locations" (Apigee proxy mobile-lbsdeviceslocations-v1).
    Returns the last known network-derived location of a mobile device on the
    Claro network. The published OpenAPI 3.0.0 document declares GET
    /lbs/devices/locations, six servers spanning SaaS sandbox/test/production
    (api*.claro.com.br) and on-premises data centres (test/cas/lpa.apigw.claro.com.br),
    and four security schemes — HTTP Basic, HTTP Bearer, an X-API-Key header, and
    OAuth 2.0 client credentials.
  humanURL: https://www.claroinsight.com.br/pt-br/device-location-retrievel
  baseURL: https://api.claro.com.br/mobile/v1
  tags:
  - Device Location
  - LBS
  - Open Gateway
  - IoT
  properties:
  - type: OpenAPI
    url: openapi/america-movil-claro-device-location-openapi.json
  - type: Documentation
    url: https://www.claroinsight.com.br/pt-br/device-location-retrievel
  - type: APIReference
    url: https://www.claroinsight.com.br/pt-br/catalogo-api
  - type: Overlay
    url: overlays/america-movil-claro-device-location-overlay.yaml
  - type: AgentSkill
    url: skills/america-movil-device-location-lookup.md
- aid: america-movil:claro-number-verification-api
  name: Claro Number Verification API
  description: >-
    CAMARA-aligned Number Verification API from Claro Brasil — silent
    verification that a mobile number is the one actually attached to the device
    making the request, offered as an alternative to SMS one-time passwords.
    Listed in the Claro Insight catalog; technical documentation and the Swagger
    download are behind portal registration.
  humanURL: https://www.claroinsight.com.br/pt-br/number-verification
  tags:
  - Number Verification
  - CAMARA
  - Open Gateway
  - Identity Verification
  properties:
  - type: Documentation
    url: https://www.claroinsight.com.br/pt-br/number-verification
  - type: APIReference
    url: https://www.claroinsight.com.br/pt-br/catalogo-api
- aid: america-movil:claro-device-location-verify-api
  name: Claro Device Location Verify API
  description: >-
    Verifies whether a mobile device is located within a caller-supplied
    geographic area, using Claro Brasil network-derived location, returning true
    or false. Claro's product page names GSMA as co-author, states that subject
    consent is mandatory under Brazil's LGPD, and links the CAMARA DeviceLocation
    v0.1.0 definition (code/API_definitions/location.yaml) as the API's technical
    reference — that upstream definition is saved verbatim in openapi/ and is the
    only machine-readable contract published for this product. Claro publishes no
    Claro-hosted variant of it and no endpoint URL; the rest of the documentation
    requires portal registration.
  humanURL: https://www.claroinsight.com.br/pt-br/device-location-verify
  tags:
  - Device Location
  - CAMARA
  - Open Gateway
  - Anti-Fraud
  properties:
  - type: Documentation
    url: https://www.claroinsight.com.br/pt-br/device-location-verify
  - type: APIReference
    url: https://www.claroinsight.com.br/pt-br/catalogo-api
  - type: OpenAPI
    url: openapi/america-movil-claro-device-location-verify-camara-openapi.yaml
- aid: america-movil:claro-know-your-customer-api
  name: Claro Know Your Customer API
  description: >-
    KYC Match-style API from Claro Brasil that validates user-supplied
    identity attributes — phone number, name, address, e-mail — against Claro's
    subscriber records for onboarding and fraud prevention. Listed in the Claro
    Insight catalog; documentation requires portal registration.
  humanURL: https://www.claroinsight.com.br/pt-br/claro-kyc
  baseURL: https://api.claro.com.br/mobile/v1/gsma/gateway/knowyourcustomer
  tags:
