generated: '2026-07-25'
method: searched
source: >-
  The "Códigos de Exemplo" tabs of the Claro Insight product pages at
  https://www.claroinsight.com.br/pt-br/<product> (served anonymously), plus the
  in-spec examples of the two harvested OpenAPI documents.
description: >-
  Request examples for the Claro Brasil API marketplace, transcribed verbatim
  from the provider's own published sample code. Credentials in the samples are
  the provider's own placeholders (XXXX / SUA_CLIENT_ID) — no real secret is
  recorded here. Two request conventions coexist: the legacy "customers"
  services (2019 vintage) wrap everything in a data.customer envelope and
  authenticate with the non-standard `x-client-auth` header, while the newer
  GSMA Open Gateway / CAMARA services use flat CAMARA payloads and the standard
  `Authorization` header.
token:
  endpoint: https://api.claro.com.br/oauth2/v1/token
  method: POST
  content_type: application/x-www-form-urlencoded
  body: grant_type=client_credentials
  auth_header_variants:
  - 'Authorization: Basic base64(client_id:client_secret)'
  - 'x-client-auth: Basic base64(client_id:client_secret)'
  response_field: access_token
examples:
- api: america-movil:claro-know-your-customer-api
  name: KYC Match
  endpoint: https://api.claro.com.br/mobile/v1/gsma/gateway/knowyourcustomer/match
  method: POST
  headers:
    Authorization: Bearer {access_token}
    Content-Type: application/json
  request:
    phoneNumber: '+5511999999999'
    idDocument: '123456789'
    name: João da Silva
    birthdate: '1990-01-01'
  source: https://www.claroinsight.com.br/pt-br/claro-kyc
- api: america-movil:claro-kyc-fill-in-api
  name: KYC Fill In
  endpoint: https://api.claro.com.br/mobile/v1/gsma/gateway/kyc/fillin
  method: POST
  headers:
    Authorization: Bearer {access_token}
    Content-Type: application/json
  request:
    phoneNumber: '+5511999999999'
  source: https://www.claroinsight.com.br/pt-br/fill-in
- api: america-movil:claro-device-location-api
  name: Device Location Retrieval (Open Gateway endpoint)
  note: >-
    The "Device Location Retrieval" product exposes a CAMARA-shaped Open Gateway
    endpoint in its code samples, distinct from the older LBS operation captured
    in openapi/america-movil-claro-device-location-openapi.json. Both are
    published by Claro under the same product page.
  endpoint: https://api.claro.com.br/mobile/v1/gsma/gateway/devicelocation/retrieve
  method: POST
  headers:
    Authorization: Bearer {access_token}
    Content-Type: application/json
  request:
    device:
      phoneNumber: '+5511999999999'
    maxAge: 600
  source: https://www.claroinsight.com.br/pt-br/device-location-retrievel
- api: america-movil:claro-geofencing-api
  name: Geofencing — create subscription
  endpoint: https://api.claro.com.br/mobile/v1/gsma/gateway/geofencing/subscriptions
  method: POST
  headers:
    Authorization: Bearer {access_token}
    X-API-Key: '{api_key}'
    Content-Type: application/json
  request:
    webhook:
      notificationUrl: https://application-server.com
      notificationAuthToken: '{notification_auth_token}'
    subscriptionDetail:
      device:
        phoneNumber: '+5511999999999'
        networkAccessIdentifier: 123456789@domain.com
        ipv4Address:
          publicAddress: 84.125.93.10
          publicPort: 4958
        ipv6Address: '2001:db8:85a3:8d3:1319:8a2e:370:7344'
      area:
        areaType: CIRCLE
        center:
          latitude: -23.5505
          longitude: -46.6333
        radius: 2000
      type: org.camaraproject.geofencing.v0.area-entered
    subscriptionExpireTime: '2025-08-18T14:06:15.589Z'
  source: https://www.claroinsight.com.br/pt-br/geofencing
