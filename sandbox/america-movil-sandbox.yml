description: >-
  Claro Brasil operates a real non-production estate — a SaaS sandbox, lab, dev
  and test edge plus an on-premises test data centre — and sells a free Trial
  plan to develop against. What it does NOT publish is any of the things that
  make a sandbox self-serve: there are no test credentials, no magic test MSISDNs,
  no deterministic fixtures and no simulator. Access to every environment
  requires registration on the marketplace and an approved API request, so an
  anonymous developer cannot make a single call.
