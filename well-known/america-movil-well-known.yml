summary: >-
  No /.well-known/ discovery document is served anywhere in the América Móvil
  group. The production API edge (api.claro.com.br) answers 403 to every
  unauthenticated path including /.well-known/*, the sandbox edge answers 404,
  and the Claro Insight portal (Drupal) answers 404. There is no
  openid-configuration, no oauth-authorization-server (RFC 8414), no
  oauth-protected-resource, no api-catalog (RFC 9727), no ai-plugin.json and no
  security.txt (RFC 9116). The OAuth 2.0 client-credentials token endpoint is
  real and live at https://api.claro.com.br/oauth2/v1/token (401 anonymous) but
  it is documented only in portal code samples, not advertised through metadata.
